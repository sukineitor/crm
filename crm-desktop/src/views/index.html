<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM - Gestión de Clientes</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Barra lateral -->
            <div class="col-md-3 bg-dark text-white sidebar">
                <div class="d-flex flex-column p-3">
                    <h4 class="mb-4">CRM Clientes</h4>
                    <button id="nuevoClienteBtn" class="btn btn-primary mb-4">
                        <i class="bi bi-plus-circle"></i> Nuevo Cliente
                    </button>
                    
                    <div class="mb-3">
                        <input type="text" id="buscarCliente" class="form-control" placeholder="Buscar cliente...">
                    </div>
                    
                    <div id="listaClientes" class="list-group list-group-flush">
                        <!-- Lista de clientes se cargará aquí -->
                    </div>
                </div>
            </div>
            
            <!-- Contenido principal -->
            <div class="col-md-9 p-4">
                <!-- Pestañas para cambiar entre vista detalle y pipeline -->
                <ul class="nav nav-tabs mb-4" id="mainTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="pipeline-tab" data-bs-toggle="tab" data-bs-target="#pipeline" type="button" role="tab">
                            <i class="bi bi-kanban"></i> Pipeline de Seguimiento
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="detalle-tab" data-bs-toggle="tab" data-bs-target="#detalle" type="button" role="tab">
                            <i class="bi bi-person-lines-fill"></i> Detalle del Cliente
                        </button>
                    </li>
                </ul>
                
                <div class="tab-content" id="mainTabsContent">
                    <!-- Tablero Kanban -->
                    <div class="tab-pane fade show active" id="pipeline" role="tabpanel">
                        <div class="kanban-board" id="kanbanBoard">
                            <!-- Las columnas se generarán dinámicamente con JavaScript -->
                        </div>
                    </div>
                    
                    <!-- Vista detallada del cliente -->
                    <div class="tab-pane fade" id="detalle" role="tabpanel">
                        <div id="contenedorCliente" class="d-none">
                    <div class="row mb-4">
                        <div class="col">
                            <h2 id="nombreCliente">Nombre del Cliente</h2>
                            <div class="btn-group" role="group" id="estadosContainer">
                                <!-- Los estados se cargarán aquí dinámicamente -->
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card mb-4">
                                <div class="card-header">
                                    <h5 class="mb-0">Información del Cliente</h5>
                                </div>
                                <div class="card-body">
                                    <form id="formCliente">
                                        <input type="hidden" id="clienteId">
                                        <div class="mb-3">
                                            <label for="nombre" class="form-label">Nombre</label>
                                            <input type="text" class="form-control" id="nombre" required>
                                        </div>
                                        <div class="mb-3">
                                            <label for="telefono" class="form-label">Teléfono</label>
                                            <input type="tel" class="form-control" id="telefono" required>
                                        </div>
                                        <div class="mb-3">
                                            <label for="email" class="form-label">Correo Electrónico</label>
                                            <input type="email" class="form-control" id="email">
                                        </div>
                                        <button type="submit" class="btn btn-primary">Guardar</button>
                                        <button type="button" id="eliminarCliente" class="btn btn-danger float-end">
                                            <i class="bi bi-trash"></i> Eliminar
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <div class="card mb-4">
                                <div class="card-header d-flex justify-content-between align-items-center">
                                    <h5 class="mb-0">Interacciones</h5>
                                    <button id="nuevaInteraccionBtn" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-plus"></i> Nueva
                                    </button>
                                </div>
                                <div class="card-body">
                                    <div id="listaInteracciones">
                                        <!-- Las interacciones se cargarán aquí -->
                                    </div>
                                </div>
                            </div>
                            
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="mb-0">Recordatorios</h5>
                                </div>
                                <div class="card-body">
                                    <div id="listaRecordatorios">
                                        <!-- Los recordatorios se cargarán aquí -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="sinSeleccion" class="text-center mt-5">
                    <i class="bi bi-people" style="font-size: 4rem; opacity: 0.5;"></i>
                    <h3 class="mt-3">Selecciona un cliente o crea uno nuevo</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para interacciones -->
    <div class="modal fade" id="interaccionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nueva Interacción</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formInteraccion">
                        <input type="hidden" id="interaccionId">
                        <div class="mb-3">
                            <label for="tipoInteraccion" class="form-label">Tipo</label>
                            <select class="form-select" id="tipoInteraccion" required>
                                <option value="llamada">Llamada</option>
                                <option value="email">Email</option>
                                <option value="reunion">Reunión</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="fechaInteraccion" class="form-label">Fecha</label>
                            <input type="datetime-local" class="form-control" id="fechaInteraccion" required>
                        </div>
                        <div class="mb-3">
                            <label for="notaInteraccion" class="form-label">Notas</label>
                            <textarea class="form-control" id="notaInteraccion" rows="3" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="guardarInteraccion" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</body>
</html>
